<section class="hero px-3 pt-4 text-center">
  <div class="row justify-content-center mx-0">
    <div class="col-12 col-lg-10 pb-4">
      <span class="badge rounded-pill hero-tag bg-white mb-2 px-3 py-2">New arrivals every week</span>
      <h1 class="display-6 fw-bold text-dark mb-2">Find everything you love, all in one place</h1>
      <p class="text-secondary mb-3">
        Browse thousands of products with great deals, honest ratings and fast checkout.
      </p>
      <div class="d-flex justify-content-center flex-wrap gap-2 gap-md-3">
        <a routerLink="/products" class="btn rounded-3 px-4 hero-btn">Shop now</a>
        <a routerLink="/products" class="btn rounded-3 px-4 hero-search d-flex align-items-center gap-2">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          Search
        </a>
        <a routerLink="/products" [queryParams]="{ favorites: '1' }"
          class="btn btn-outline-danger rounded-3 px-4">My favorites</a>
      </div>
    </div>
  </div>
</section>
