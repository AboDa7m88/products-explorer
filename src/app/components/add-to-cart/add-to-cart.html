<button
  type="button"
  class="btn add-cart-btn w-100"
  [class.added]="isAdded()"
  [disabled]="product.stock <= 0"
  (click)="openPicker()"
>
  @if (product.stock <= 0) {
    Out of Stock
  } @else if (isAdded()) {
    <i class="bi bi-check-circle-fill me-2"></i>
    Added to cart
  } @else {
    <i class="bi bi-cart-plus me-2"></i>
    Add to Cart
  }
</button>

@if (isPickerOpen()) {
  <div class="qty-backdrop" (click)="closePicker()">
    <div class="qty-box" (click)="$event.stopPropagation()">
      <h5 class="qty-title">{{ product.title }}</h5>
      <p class="qty-label">Select quantity</p>

      <div class="qty-controls">
        <button type="button" class="qty-btn" (click)="decrease()" [disabled]="quantity() <= 1">−</button>
        <span class="qty-value">{{ quantity() }}</span>
        <button type="button" class="qty-btn" (click)="increase()" [disabled]="quantity() >= product.stock">+</button>
      </div>

      <div class="qty-actions">
        <button type="button" class="btn" (click)="closePicker()">Cancel</button>
        <button type="button" class="btn add-cart-btn" (click)="confirm()">Add to Cart</button>
      </div>
    </div>
  </div>
}
