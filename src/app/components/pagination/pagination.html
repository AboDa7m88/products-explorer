<div class="d-flex justify-content-center align-items-center gap-3 py-3">
  <button
    type="button"
    class="btn btn-sm pagination-previous"
    [disabled]="isFirst"
    (click)="go(page - 1)"
  >
    ← <span class="d-none d-sm-inline">Previous</span>
  </button>

  <span class="small pagination-label">
    Page {{ page }} of {{ totalPages }}
  </span>

  <button
    type="button"
    class="btn btn-sm pagination-next"
    [disabled]="isLast"
    (click)="go(page + 1)"
  >
    <span class="d-none d-sm-inline">Next</span> →
  </button>
</div>
