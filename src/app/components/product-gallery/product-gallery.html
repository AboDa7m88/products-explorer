<div class="d-flex flex-column-reverse flex-md-row gap-2">
  <div class="d-flex flex-row flex-md-column flex-wrap gap-2">
    @for (img of images; track $index) {
      <button
        type="button"
        class="thumb"
        [class.active]="$index === selected()"
        (click)="selected.set($index)"
      >
        <img [src]="img" [alt]="title + ' ' + ($index + 1)" />
      </button>
    }
  </div>

  <div class="main-image flex-grow-1">
    <img [src]="images[selected()]" [alt]="title" />
  </div>
</div>
