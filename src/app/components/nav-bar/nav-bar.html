@if (!isHome()) {
<nav class="navbar bg-white border-bottom px-3 px-md-4">

  <a routerLink="/" aria-label="Home">
    <img src="logo3.png" alt="company logo" class="brand-logo">
  </a>

  <div class="d-flex align-items-center gap-2 gap-md-3">
    <a class="nav-link d-none d-sm-block small" routerLink="/"
      routerLinkActive="fw-bold" [routerLinkActiveOptions]="{ exact: true }">Home</a>

    <a class="nav-link d-none d-sm-block small" routerLink="/products"
      routerLinkActive="fw-bold">Products</a>

    <a routerLink="/" class="home-btn d-sm-none" aria-label="Home">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5" />
        <path d="M5 9.5V21h14V9.5" />
        <path d="M10 21v-6h4v6" />
      </svg>
    </a>

    <app-favorites-only-button
     [active]="favoritesOnly()"
     [count]="favoritesCount"
     (toggle)="onFavoritesToggle()" />

    <app-cart-button />
  </div>
</nav>
}
