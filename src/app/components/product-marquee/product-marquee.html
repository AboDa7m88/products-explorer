<section class="mb-4">
  <div class="d-flex justify-content-between align-items-center mb-1">
    <h2 class="h5 fw-bold m-0">{{ heading() }}</h2>
    <a routerLink="/products" class="small fw-semibold view-all">View all</a>
  </div>

  <div class="marquee overflow-hidden">
    <div class="marquee-track d-flex">
      @for (p of loopProducts(); track $index) {
      <div class="marquee-item px-1 py-2">
        <app-product-card
          [product]="p"
          [isFavorite]="favorites.isFavorite(p.id)"
          [showRating]="false"
          (favoriteToggle)="favorites.toggle($event)" />
      </div>
      }
    </div>
  </div>
</section>
